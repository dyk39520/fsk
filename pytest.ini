[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --html=reports/report.html --self-contained-html

markers =
    smoke: home page smoke tests
    login: login tests
    register: registration tests
    register_positive: registration tests that create real accounts
    core: core business tests
    core_stable: stable core regression tests
    store: store search/cart/checkout tests
    booking: booking appointment tests
    booking_submit: tests that create real bookings when explicitly enabled
    payment: payment/checkout tests
